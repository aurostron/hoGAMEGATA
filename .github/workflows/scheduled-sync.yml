name: Scheduled Database Synchronization

on:
  schedule:
    # Runs at 03:00 UTC daily (8:30 AM IST)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual trigger via the GitHub Actions UI
    inputs:
      limit:
        description: 'Override batch record limit per stage'
        required: false
        default: '30'
      mode:
        description: 'Sync Mode (--sync or --reset)'
        required: true
        type: choice
        options:
          - '--sync'
          - '--reset'
        default: '--sync'

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Master Sync Pipeline (Scheduled)
      if: github.event_name == 'schedule'
      run: npm run pipeline:run -- --sync --limit 100

    - name: Run Master Sync Pipeline (Manual dispatch)
      if: github.event_name == 'workflow_dispatch'
      run: npm run pipeline:run -- ${{ github.event.inputs.mode }} --limit ${{ github.event.inputs.limit }}
